[project]
name = "unik-scheduler"
version = "0.1.0"
description = "Telegram bot with personal KPI schedule reminders"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4",
    "sqlalchemy[asyncio]>=2.0.52,<3",
    "asyncpg>=0.31,<0.32",
    "apscheduler>=3.11,<4",
    "pydantic-settings>=2.15,<3",
    "aiohttp>=3.14,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[project.scripts]
unik-scheduler = "unik_scheduler.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unik_scheduler"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
