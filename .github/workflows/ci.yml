name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: /opt/unik-scheduler
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install --disable-pip-version-check -e ".[dev]"

      - name: Check formatting
        run: ruff format --check --diff src tests tools

      - name: Run linter
        run: ruff check src tests tools

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install --disable-pip-version-check -e ".[dev]"

      - name: Run tests
        run: pytest -q --junitxml=junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: junit.xml
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build and push image
    needs: [lint, test]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGISTRY_USER: ${{ github.actor }}
      BOT_IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sshpass

      - name: Configure SSH host verification
        shell: bash
        run: |
          : "${DEPLOY_HOST:?Repository secret DEPLOY_HOST is not set}"
          : "${DEPLOY_USER:?Repository secret DEPLOY_USER is not set}"
          : "${SSHPASS:?Repository secret DEPLOY_PASSWORD is not set}"
          : "${SSH_KNOWN_HOSTS:?Repository secret SSH_KNOWN_HOSTS is not set}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy deployment files
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          sshpass -e scp \
            -o StrictHostKeyChecking=yes \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            docker-compose.prod.yml "$target:$APP_DIR/"

      - name: Deploy image
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_options=(
            -o StrictHostKeyChecking=yes
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no
          )

          printf '%s' "$GHCR_TOKEN" | sshpass -e ssh "${ssh_options[@]}" "$target" \
            "docker login '$REGISTRY' --username '$REGISTRY_USER' --password-stdin"

          printf -v remote_command 'bash -s -- %q %q' "$APP_DIR" "$BOT_IMAGE"
          sshpass -e ssh "${ssh_options[@]}" "$target" "$remote_command" <<'REMOTE'
          set -euo pipefail

          APP_DIR="$1"
          IMAGE="$2"
          COMPOSE_FILE="docker-compose.prod.yml"
          READY_LINE="bot started"
          READY_TIMEOUT=90

          cd "$APP_DIR"
          if [[ ! -f .env ]]; then
              echo "!! $APP_DIR/.env is missing — create it before the first deploy" >&2
              exit 1
          fi

          previous="$(grep -E '^BOT_IMAGE=' .env | tail -1 | cut -d= -f2- || true)"

          set_image() {
              local ref="$1" tmp
              tmp="$(mktemp)"
              grep -v '^BOT_IMAGE=' .env > "$tmp" || true
              printf 'BOT_IMAGE=%s\n' "$ref" >> "$tmp"
              cat "$tmp" > .env
              rm -f "$tmp"
          }

          wait_until_ready() {
              local since="$1" deadline=$((SECONDS + READY_TIMEOUT)) state
              while (( SECONDS < deadline )); do
                  if docker compose -f "$COMPOSE_FILE" logs --since "$since" bot 2>/dev/null \
                      | grep -q "$READY_LINE"; then
                      return 0
                  fi

                  state="$(docker compose -f "$COMPOSE_FILE" \
                      ps -a --format '{{.State}}' bot || true)"
                  case "$state" in
                      exited | dead)
                          echo "!! the bot container exited"
                          return 1
                          ;;
                      restarting)
                          echo "!! the bot container is crash-looping"
                          return 1
                          ;;
                  esac
                  sleep 3
              done
              echo "!! the bot did not report readiness within ${READY_TIMEOUT}s"
              return 1
          }

          echo "==> deploying $IMAGE"
          set_image "$IMAGE"
          docker compose -f "$COMPOSE_FILE" pull --quiet bot

          started_at="$(date -u +%Y-%m-%dT%H:%M:%S)"
          docker compose -f "$COMPOSE_FILE" up -d

          if wait_until_ready "$started_at"; then
              echo "==> deployed: $IMAGE"
              docker image prune -f >/dev/null 2>&1 || true
              docker compose -f "$COMPOSE_FILE" ps
              exit 0
          fi

          echo "==> last 40 log lines"
          docker compose -f "$COMPOSE_FILE" logs --tail 40 bot || true

          if [[ -n "$previous" && "$previous" != "$IMAGE" ]]; then
              echo "==> rolling back to $previous"
              set_image "$previous"
              rollback_started_at="$(date -u +%Y-%m-%dT%H:%M:%S)"
              docker compose -f "$COMPOSE_FILE" up -d
              if wait_until_ready "$rollback_started_at"; then
                  echo "==> rolled back to $previous"
              else
                  echo "!! rollback did not come up either — the stack needs a human"
              fi
          else
              echo "!! no previous image recorded, leaving the stack as is"
          fi
          exit 1
          REMOTE
